spring.application.name=Personalized-Learning-System

spring.datasource.url=jdbc:mysql://localhost:3306/personalized_learning_system
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# Optional: specify a free-tier model like gemini-1.5-flash
spring.ai.google.genai.chat.options.model=gemini-1.5-flash

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB